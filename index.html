<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Répertoire Piano - Elise</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#f7f5f2;--surface:#fff;--surface2:#f0ede8;--border:#e8e3dc;
  --text:#2a2520;--text2:#7a7068;--text3:#b0a898;
  --accent:#1e3a6e;--accent-soft:#e0e8f5;
  --accent2:#c97b5a;--accent2-soft:#faeee7;
  --green:#5a9e7c;--green-soft:#e6f4ed;
  --amber:#c49a3a;--amber-soft:#fdf3df;
  --red:#c0564a;--red-soft:#fcecea;
  --shadow:0 2px 12px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.10);
  --radius:16px;--radius-sm:10px;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#18171a;--surface:#232228;--surface2:#2c2b32;--border:#35333d;
  --text:#f0eee9;--text2:#a09898;--text3:#5a5560;
  --accent:#2a4a8a;--accent-soft:#dde6f5;
  --accent2:#d4906c;--accent2-soft:#3a2820;
  --green:#6abf92;--green-soft:#e6f4ed;
  --amber:#d4ae5a;--amber-soft:#fdf3df;
  --red:#d47068;--red-soft:#2e1a18;
  --shadow:0 2px 12px rgba(0,0,0,.3);--shadow-lg:0 8px 32px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;transition:background .3s,color .3s;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:28px 32px 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.htitle{font-family:var(--serif);font-size:clamp(32px,5vw,48px);font-weight:600;line-height:1.1;}
.htitle span{color:var(--accent);font-style:italic;}
.hsub{font-size:13px;color:var(--text2);margin-top:6px;font-weight:300;}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sync-status{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--text3);}
.sdot.ok{background:var(--green);}
.sdot.syncing{background:var(--amber);animation:pulse 1s infinite;}
.sdot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn-theme{background:var(--surface2);border:1px solid var(--border);color:var(--text2);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .2s;}
.btn-theme:hover{border-color:var(--accent);color:var(--accent);}
.stats{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;overflow-x:auto;}
.stat{display:flex;align-items:center;gap:10px;padding:16px 24px 16px 0;margin-right:24px;border-right:1px solid var(--border);flex-shrink:0;}
.stat:last-child{border-right:none;}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.si-p{background:#fcecea}.si-g{background:var(--green-soft)}.si-a{background:var(--amber-soft)}.si-r{background:var(--accent-soft)}
.stat-num{font-family:var(--serif);font-size:22px;font-weight:600;display:block;}
.stat-label{font-size:11px;color:var(--text2);display:block;margin-top:2px;}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;}
.tab-btn{background:none;border:none;color:var(--text2);font-family:var(--sans);font-size:13px;font-weight:500;padding:14px 4px;margin-right:28px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;margin-bottom:-1px;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.controls{display:flex;gap:10px;padding:20px 32px;background:var(--bg);flex-wrap:wrap;align-items:center;}
.search-wrap{flex:1;min-width:180px;position:relative;}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 14px 10px 38px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;}
.search-wrap input::placeholder{color:var(--text3);}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none;}
.fsel{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:13px;outline:none;cursor:pointer;}
.fsel:focus{border-color:var(--accent);}
.btn-p{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:opacity .2s;}
.btn-p:hover{opacity:.88;}
.btn-p:disabled{opacity:.4;cursor:not-allowed;}
.btn-s{background:var(--surface);color:var(--text2);border:1px solid var(--border);padding:10px 16px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s;}
.btn-s:hover{border-color:var(--accent);color:var(--accent);}
.btn-auth{font-size:11px !important;padding:7px 12px !important;}
.cards{padding:0 32px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s;animation:cardIn .25s ease forwards;opacity:0;}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
.badges{display:flex;gap:6px;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;}
.b-en-cours{background:var(--amber-soft);color:var(--amber);}
.b-maitrise{background:var(--green-soft);color:var(--green);}
.b-a-revoir{background:var(--red-soft);color:var(--red);}
.b-en-pause{background:var(--surface2);color:var(--text2);}
.b-debutant{background:var(--green-soft);color:var(--green);}
.b-intermediaire{background:var(--accent-soft);color:var(--accent);}
.b-avance{background:var(--accent2-soft);color:var(--accent2);}
.card-acts{display:flex;gap:2px;opacity:0;transition:opacity .15s;}
.card:hover .card-acts{opacity:1;}
.ca{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:4px 7px;border-radius:6px;transition:all .15s;}
.ca:hover{background:var(--surface2);color:var(--text);}
.ca.del:hover{background:var(--red-soft);color:var(--red);}
.card-title{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.3;margin-bottom:8px;}
.card-composer{margin-bottom:12px;}
.card-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;}
.card-meta span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);}
.card-notes{margin-top:8px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);line-height:1.5;font-style:italic;}
.ndot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle;}
.card-footer{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;}
.btn-pdf{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--accent);transition:all .2s;}
.btn-pdf:hover{border-color:var(--accent);background:var(--accent-soft);}
.btn-upload{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;border:1px dashed var(--border);background:transparent;color:var(--text3);transition:all .2s;}
.btn-upload:hover{border-color:var(--accent);color:var(--accent);}
.empty{grid-column:1/-1;text-align:center;padding:80px 24px;color:var(--text3);}
/* VIDEO */
.video-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:flex;flex-direction:column;backdrop-filter:blur(4px);}
.video-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0;}
.video-title{font-family:var(--serif);font-size:16px;font-weight:600;}
.video-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
.video-wrap iframe{width:100%;max-width:900px;aspect-ratio:16/9;border:none;border-radius:var(--radius-sm);}
.score-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;gap:8px;flex-shrink:0;}
.score-bar-left{font-size:12px;color:var(--text2);font-style:italic;flex:1;min-width:80px;}
.score-bar-right{display:flex;gap:8px;align-items:center;}
/* PDF VIEWER */
.pdf-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;flex-direction:column;backdrop-filter:blur(4px);}
.pdf-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0;}
.pdf-title{font-family:var(--serif);font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pdf-body{flex:1;overflow:auto;background:#525659;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;}
.pdf-canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;}
.pdf-canvas-wrap canvas{display:block;max-width:100%;height:auto;}
.pdf-nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px;background:#3a3a3a;flex-shrink:0;}
/* TIMELINE */
.tl-ctrl{display:flex;align-items:center;gap:16px;padding:20px 32px;background:var(--bg);flex-wrap:wrap;}
.yn{display:flex;align-items:center;gap:10px;}
.btn-yr{background:var(--surface);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .15s;}
.btn-yr:hover{border-color:var(--accent);color:var(--accent);}
.btn-yr:disabled{opacity:.25;cursor:default;pointer-events:none;}
.yr-lbl{font-family:var(--serif);font-size:20px;font-weight:600;min-width:120px;text-align:center;}
.tl-leg{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.leg-dot{width:8px;height:8px;border-radius:50%;}
.tl-wrap{padding:0 32px 32px;overflow-x:auto;}
.tl-inner{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);min-width:520px;}
.tl-mrow{display:flex;padding-left:200px;border-bottom:1px solid var(--border);background:var(--surface2);}
.tl-m{flex:1;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-align:center;padding:10px 0;}
.tl-m.now{color:var(--accent);font-weight:600;}
.tl-row{display:flex;align-items:center;min-height:44px;border-bottom:1px solid var(--border);transition:background .12s;}
.tl-row:last-child{border-bottom:none;}
.tl-row:hover{background:var(--surface2);}
.tl-lbl{width:200px;min-width:200px;padding:8px 16px 8px 20px;}
.tl-lt{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.tl-lc{font-size:11px;color:var(--text3);font-style:italic;display:block;}
.tl-ba{flex:1;position:relative;height:36px;padding-right:16px;}
.tl-bar{position:absolute;top:50%;transform:translateY(-50%);height:10px;border-radius:6px;cursor:pointer;transition:height .15s;min-width:4px;}
.tl-bar:hover{height:18px;}
.tl-now{position:absolute;top:0;bottom:0;width:1.5px;background:var(--accent);opacity:.4;pointer-events:none;border-radius:2px;}
.tl-empty{text-align:center;padding:48px;font-size:13px;color:var(--text3);}
.tooltip{position:fixed;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:var(--radius-sm);font-size:12px;pointer-events:none;z-index:300;max-width:260px;display:none;box-shadow:var(--shadow-lg);}
.tooltip strong{display:block;font-family:var(--serif);font-size:14px;margin-bottom:4px;}
.tooltip em{color:var(--text2);}
/* MODAL — scroll natif sur mobile */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;padding:16px;backdrop-filter:blur(4px);overflow-y:auto;-webkit-overflow-scrolling:touch;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);max-width:500px;width:100%;box-shadow:var(--shadow-lg);margin:0 auto;position:relative;}
.modal-hd{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 18px;border-bottom:1px solid var(--border);}
.modal-hd h2{font-family:var(--serif);font-size:20px;font-weight:600;}
.btn-x{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s;}
.btn-x:hover{background:var(--surface2);color:var(--text);}
.modal-body{padding:22px 24px;}
.modal-ft{padding:16px 24px 24px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--border);}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field input::placeholder,.field textarea::placeholder{color:var(--text3);}
.field textarea{resize:vertical;min-height:72px;}
.pdf-upload-zone{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;cursor:pointer;transition:all .2s;position:relative;}
.pdf-upload-zone:hover{border-color:var(--accent);background:var(--accent-soft);}
.pdf-upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.pdf-upload-label{font-size:12px;color:var(--text2);}
.pdf-upload-name{font-size:12px;color:var(--green);font-weight:500;margin-top:4px;}
.del-confirm{background:var(--red-soft);border:1px solid var(--red);border-radius:var(--radius-sm);padding:14px 16px;margin:0 32px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.del-confirm span{font-size:13px;color:var(--red);flex:1;}
.btn-dc{background:var(--red);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;}
.btn-dcc{background:none;border:1px solid var(--border);color:var(--text2);padding:8px 14px;border-radius:8px;font-family:var(--sans);font-size:12px;cursor:pointer;}
.footer{border-top:1px solid var(--border);padding:12px 32px;font-size:11px;color:var(--text3);display:flex;justify-content:space-between;background:var(--surface);}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-radius:var(--radius-sm);padding:12px 18px;font-size:13px;box-shadow:var(--shadow-lg);z-index:600;animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeO{from{opacity:0}to{opacity:1}}
@keyframes slideM{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:600px){
  .header,.controls,.cards,.tl-ctrl,.tl-wrap,.del-confirm{padding-left:16px;padding-right:16px;}
  .stats,.tabs{padding:0 16px;}
  .fg{grid-template-columns:1fr;}
  .field.full{grid-column:1;}
}
</style>
</head>
<body>
<div class="header" id="app-header">
  <div>
    <div class="eyebrow">Journal de pratique</div>
    <div class="htitle">Mon <span>Répertoire</span></div>
    <div class="hsub">Elise &amp; Camille G. &mdash; depuis octobre 2021</div>
  </div>
  <div class="hright">
    <div class="sync-status"><span class="sdot" id="sdot"></span><span id="slbl">Chargement...</span></div>
    <button class="btn-s btn-auth" id="btn-auth" onclick="toggleAuth()">🔓 Connexion</button>
    <button class="btn-theme" onclick="toggleTheme()" id="btn-theme">🌙</button>
  </div>
</div>
<div class="stats" id="statsBar"></div>
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('liste')">Morceaux</button>
  <button class="tab-btn" onclick="switchTab('timeline')">Timeline</button>
</div>
<div id="tab-liste">
  <div class="controls">
    <div class="search-wrap">
      <span class="si">♩</span>
      <input type="text" id="searchInput" placeholder="Rechercher..." oninput="renderCards()">
    </div>
    <select class="fsel" id="fStatus" onchange="renderCards()">
      <option value="">Tous statuts</option>
      <option value="en-cours">En cours</option>
      <option value="maitrise">Maîtrisé</option>
      <option value="a-revoir">À revoir</option>
      <option value="en-pause">En pause</option>
    </select>
    <select class="fsel" id="fLevel" onchange="renderCards()">
      <option value="">Tous niveaux</option>
      <option value="debutant">Débutant</option>
      <option value="intermediaire">Intermédiaire</option>
      <option value="avance">Avancé</option>
    </select>
    <button class="btn-p" id="btn-add" onclick="openModal()">+ Ajouter</button>
    <button class="btn-s" id="btn-export" onclick="exportPDF()">⬇ Export PDF</button>
  </div>
  <div id="del-wrap"></div>
  <div class="cards" id="cardsWrap"></div>
  <div class="footer"><span id="fcount"></span><span id="fsync"></span></div>
</div>
<div id="tab-timeline" style="display:none">
  <div class="tl-ctrl">
    <div class="yn">
      <button class="btn-yr" id="btn-prev" onclick="changeYear(-1)">‹</button>
      <span class="yr-lbl" id="yr-lbl"></span>
      <button class="btn-yr" id="btn-next" onclick="changeYear(1)">›</button>
    </div>
    <div class="tl-leg" id="tl-leg"></div>
  </div>
  <div class="tl-wrap"><div class="tl-inner" id="tl-grid"></div></div>
</div>
<div class="tooltip" id="tooltip"></div>

<!-- VIDEO VIEWER -->
<div class="video-overlay" id="video-overlay" style="display:none">
  <div class="video-header">
    <span class="video-title" id="video-viewer-title"></span>
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="btn-s" id="btn-score-over" style="font-size:11px;padding:6px 12px;display:none" onclick="toggleScoreOver()">📄 Voir partition</button>
      <button class="btn-x" onclick="closeVideo()" style="font-size:22px;">✕</button>
    </div>
  </div>
  <div class="video-wrap" id="video-wrap">
    <iframe id="video-frame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
  </div>
  <div id="score-over" style="display:none;position:absolute;inset:56px 0 0 0;background:var(--surface);z-index:10;flex-direction:column;">
    <div class="score-bar">
      <span class="score-bar-left">🎵 Audio en cours</span>
      <div class="score-bar-right">
        <button onclick="pdfPrevPage()" class="btn-s" style="font-size:12px;padding:6px 10px;">←</button>
        <span id="pdf-page-info2" style="font-size:12px;color:var(--text2);min-width:50px;text-align:center;"></span>
        <button onclick="pdfNextPage()" class="btn-s" style="font-size:12px;padding:6px 10px;">→</button>
        <button onclick="toggleScoreOver()" class="btn-s" style="font-size:11px;padding:6px 10px;color:var(--red);border-color:var(--red);">✕ Fermer</button>
      </div>
    </div>
    <div style="flex:1;overflow:auto;background:#525659;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center;padding:16px;">

    </div>
  </div>
</div>

<script>
var GH_OWNER='EL-webapp',GH_REPO='piano',GH_FILE='data.json',GH_EMAIL='eliselamic@hotmail.com';
function getToken(){return localStorage.getItem('gh_token');}
function setToken(t){localStorage.setItem('gh_token',t);}
function b64enc(str){return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,function(_,p){return String.fromCharCode(parseInt(p,16));}));}
function b64dec(str){return decodeURIComponent(atob(str).split('').map(function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);}).join(''));}

var pieces=[],fileSha=null,editIdx=null,delIdx=null,lastSync=null,tlSY=curSY();
var pendingPdfB64=null,currentVideoIdx=null;
var pdfDoc=null,pdfPage=1,pdfTotal=0,pdfRendering=false,pdfjsLib=null;

var TLC=['#a8c4e0','#f0b8a8','#a8d4b8','#f0d8a0','#d4b0cc','#a8d8d4','#f0c8a0','#b8d0a8','#c8b8e0','#f0b8c8'];
var CC=[{bg:'#dce8f5',t:'#1a3a6a'},{bg:'#fde8d8',t:'#7a3010'},{bg:'#f0e8f8',t:'#4a2080'},{bg:'#e0f0f0',t:'#1a5858'},{bg:'#fdf0d8',t:'#6a4008'},{bg:'#f8e8f0',t:'#7a1848'},{bg:'#e8eef8',t:'#1a2860'},{bg:'#f8f0e0',t:'#5a3808'},{bg:'#e8f8f8',t:'#0a5050'},{bg:'#f0e0f8',t:'#501870'}];
var tlCM={},cCM={};
function tlC(c){if(!tlCM[c])tlCM[c]=TLC[Object.keys(tlCM).length%TLC.length];return tlCM[c];}
function cC(c){if(!cCM[c])cCM[c]=CC[Object.keys(cCM).length%CC.length];return cCM[c];}
function cbadge(c){var col=cC(c);return '<span class="badge" style="background:'+col.bg+';color:'+col.t+'">'+esc(c)+'</span>';}

var SL={'en-cours':'En cours','maitrise':'Maîtrisé','a-revoir':'À revoir','en-pause':'En pause'};
var LL={'debutant':'Débutant','intermediaire':'Intermédiaire','avance':'Avancé'};
var SI={'en-cours':'🎵','maitrise':'👏🏻','a-revoir':'↺','en-pause':'⏸'};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(d){if(!d)return null;var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function toast(msg,col){var t=document.createElement('div');t.className='toast';if(col)t.style.borderLeftColor=col;t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},3500);}
function setSS(state,lbl){document.getElementById('sdot').className='sdot '+state;document.getElementById('slbl').textContent=lbl;}
function updFooter(){if(!lastSync)return;var h=lastSync.getHours().toString().padStart(2,'0'),m=lastSync.getMinutes().toString().padStart(2,'0');document.getElementById('fsync').textContent='Sync '+h+':'+m;}

function isRO(){return !getToken();}
function updAuthBtn(){
  var btn=document.getElementById('btn-auth');
  if(getToken()){btn.textContent='🔒 Écriture';btn.style.color='var(--green)';btn.style.borderColor='var(--green)';}
  else{btn.textContent='🔓 Connexion';btn.style.color='';btn.style.borderColor='';}
}
function updRO(){updAuthBtn();var ba=document.getElementById('btn-add');ba.disabled=isRO();ba.title=isRO()?'Mode lecture seule':'';}
function toggleAuth(){
  if(getToken()){if(confirm('Se déconnecter ?')){localStorage.removeItem('gh_token');location.reload();}}
  else{var t=prompt('Token GitHub :');if(t&&t.trim()){setToken(t.trim());location.reload();}}
}

async function ghGet(path){
  var r=await fetch('https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path+'?t='+Date.now(),{headers:{Accept:'application/vnd.github.v3+json'}});
  if(!r.ok)throw new Error(r.status);return r.json();
}
async function ghPut(path,content,sha,msg){
  var body={message:msg,content:content,committer:{name:'Elise',email:GH_EMAIL}};
  if(sha)body.sha=sha;
  var r=await fetch('https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path,{method:'PUT',headers:{Authorization:'token '+getToken(),Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status);return r.json();
}

async function ghLoad(){
  setSS('syncing','Chargement...');
  try{
    var d=await ghGet(GH_FILE);fileSha=d.sha;
    var content=JSON.parse(b64dec(d.content.replace(/\n/g,'')));
    pieces=content.length?content:[];
    lastSync=new Date();setSS('ok',isRO()?'Lecture seule':'Synchronisé');updFooter();
  }catch(e){
    setSS('error','Erreur');
    try{var s=localStorage.getItem('piano_v4');if(s)pieces=JSON.parse(s);}catch(e2){}
    toast('Mode hors-ligne','var(--amber)');
  }
  renderCards();updRO();
}

async function ghSave(msg){
  if(!getToken()){localStorage.setItem('piano_v4',JSON.stringify(pieces));return;}
  setSS('syncing','Sauvegarde...');
  try{
    var d=await ghPut(GH_FILE,b64enc(JSON.stringify(pieces,null,2)),fileSha,msg||'MAJ');
    fileSha=d.content.sha;lastSync=new Date();setSS('ok','Synchronisé');updFooter();
    localStorage.setItem('piano_v4',JSON.stringify(pieces));
    toast('Sauvegarde OK','var(--green)');
  }catch(e){
    setSS('error','Erreur');localStorage.setItem('piano_v4',JSON.stringify(pieces));
    toast('Sauvegarde locale','var(--amber)');
  }
}

async function ghUploadPDF(filename,b64content){
  setSS('syncing','Upload PDF...');
  try{
    var sha=null;
    try{var existing=await ghGet('partitions/'+filename);sha=existing.sha;}catch(e){}
    await ghPut('partitions/'+filename,b64content,sha,'Partition: '+filename);
    toast('PDF uploadé','var(--green)');return true;
  }catch(e){toast('Erreur upload PDF','var(--red)');return false;}
}

function onPdfSelect(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){pendingPdfB64=ev.target.result.split(',')[1];document.getElementById('pdf-name').textContent=file.name;};
  reader.readAsDataURL(file);
}

function pdfFilename(p){return p.title.replace(/[^a-zA-Z0-9\-_]/g,'_').toLowerCase()+'_'+p.composer.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase()+'.pdf';}
function pdfUrl(p){return 'https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/main/partitions/'+pdfFilename(p);}

function loadPdfJs(cb){
  if(pdfjsLib){cb();return;}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  s.onload=function(){
    pdfjsLib=window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    cb();
  };
  document.head.appendChild(s);
}

function openPDF(idx){
  var p=pieces[idx],url=pdfUrl(p);
  document.getElementById('pdf-viewer-title').textContent=p.title+' - '+p.composer;
  document.getElementById('pdf-dl-link').href=url;
  document.getElementById('pdf-overlay').style.display='flex';
  document.getElementById('pdf-page-info').textContent='Chargement...';
  loadPdfJs(function(){
    pdfjsLib.getDocument(url).promise.then(function(doc){
      pdfDoc=doc;pdfTotal=doc.numPages;pdfPage=1;renderPdfPage(1);
    }).catch(function(){document.getElementById('pdf-page-info').textContent='Erreur';});
  });
}

function renderPdfPage(num){
  if(pdfRendering)return;pdfRendering=true;
  document.getElementById('pdf-page-info').textContent='Page '+num+' / '+pdfTotal;
  pdfDoc.getPage(num).then(function(page){
    var wrap=document.getElementById('pdf-canvas-wrap');
    var availW=wrap.clientWidth-32;
    var availH=wrap.clientHeight-32;
    var vp=page.getViewport({scale:1});
    var scaleW=availW/vp.width;
    var scaleH=availH/vp.height;
    // Utilise le plus petit des deux pour que la page rentre dans les deux dimensions
    var scale=Math.min(scaleW,scaleH);
    var dpr=window.devicePixelRatio||1;
    var viewport=page.getViewport({scale:scale*dpr});
    var canvas=document.getElementById('pdf-canvas');
    var ctx=canvas.getContext('2d');
    canvas.width=viewport.width;canvas.height=viewport.height;
    canvas.style.width=(viewport.width/dpr)+'px';canvas.style.height=(viewport.height/dpr)+'px';
    page.render({canvasContext:ctx,viewport:viewport}).promise.then(function(){pdfRendering=false;});
  });
}

function renderPdfPage2(num){
  document.getElementById('pdf-page-info2').textContent=num+'/'+pdfTotal;
  pdfDoc.getPage(num).then(function(page){
    var wrap=document.getElementById('score-over');
    var maxW=Math.min(wrap.clientWidth-32,800);
    var vp=page.getViewport({scale:1});
    var dpr=window.devicePixelRatio||1;
    var viewport=page.getViewport({scale:(maxW/vp.width)*dpr});
    var canvas=document.getElementById('pdf-canvas2');
    var ctx=canvas.getContext('2d');
    canvas.width=viewport.width;canvas.height=viewport.height;
    canvas.style.width=(viewport.width/dpr)+'px';canvas.style.height=(viewport.height/dpr)+'px';
    page.render({canvasContext:ctx,viewport:viewport});
  });
}

function pdfPrevPage(){
  if(pdfPage<=1)return;pdfPage--;
  if(document.getElementById('score-over').style.display==='flex')renderPdfPage2(pdfPage);else renderPdfPage(pdfPage);
}
function pdfNextPage(){
  if(pdfPage>=pdfTotal)return;pdfPage++;
  if(document.getElementById('score-over').style.display==='flex')renderPdfPage2(pdfPage);else renderPdfPage(pdfPage);
}
function closePDF(){document.getElementById('pdf-overlay').style.display='none';pdfDoc=null;}

function ytEmbedUrl(url){
  if(!url)return null;
  var m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  return m?'https://www.youtube.com/embed/'+m[1]+'?autoplay=1':null;
}
function openVideo(idx){
  var p=pieces[idx],embed=ytEmbedUrl(p.videoUrl);
  if(!embed){toast('Lien YouTube invalide','var(--red)');return;}
  currentVideoIdx=idx;
  document.getElementById('video-viewer-title').textContent=p.title+' - '+p.composer;
  document.getElementById('video-frame').src=embed;
  document.getElementById('video-overlay').style.display='flex';
  document.getElementById('btn-score-over').style.display=p.pdfFile?'block':'none';
  document.getElementById('score-over').style.display='none';
}
function toggleScoreOver(){
  var so=document.getElementById('score-over');
  if(so.style.display==='flex'){
    so.style.display='none';
    document.getElementById('btn-score-over').textContent='📄 Voir partition';
  }else{
    so.style.display='flex';so.style.flexDirection='column';
    document.getElementById('btn-score-over').textContent='📄 Masquer';
    if(currentVideoIdx!==null){
      loadPdfJs(function(){
        pdfjsLib.getDocument(pdfUrl(pieces[currentVideoIdx])).promise.then(function(doc){
          pdfDoc=doc;pdfTotal=doc.numPages;pdfPage=1;renderPdfPage2(1);
        });
      });
    }
  }
}
function closeVideo(){
  document.getElementById('video-overlay').style.display='none';
  document.getElementById('video-frame').src='';
  document.getElementById('score-over').style.display='none';
  currentVideoIdx=null;pdfDoc=null;
}

function toggleTheme(){
  var h=document.documentElement,d=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',d?'light':'dark');
  document.getElementById('btn-theme').textContent=d?'🌙':'☀️';
}
function switchTab(n){
  document.querySelectorAll('.tab-btn').forEach(function(b,i){b.classList.toggle('active',['liste','timeline'][i]===n);});
  document.getElementById('tab-liste').style.display=n==='liste'?'block':'none';
  document.getElementById('tab-timeline').style.display=n==='timeline'?'block':'none';
  if(n==='timeline'){
    // Démarre sur l'année la plus ancienne
    var sySorted=pieces.filter(function(p){return p.startDate;}).map(function(p){var d=new Date(p.startDate);return d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;});
    if(sySorted.length)tlSY=Math.min.apply(null,sySorted);
    renderTL();
  }
}
function getFiltered(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var st=document.getElementById('fStatus').value,lv=document.getElementById('fLevel').value;
  return pieces.map(function(p,i){return Object.assign({},p,{_i:i});}).filter(function(p){
    return(!q||p.title.toLowerCase().includes(q)||p.composer.toLowerCase().includes(q))&&(!st||p.status===st)&&(!lv||p.level===lv);
  }).sort(function(a,b){return(a.startDate||'').localeCompare(b.startDate||'');});
}
function renderCards(){
  cCM={};
  var data=getFiltered();
  var tot=pieces.length,mai=pieces.filter(function(p){return p.status==='maitrise';}).length,
      enc=pieces.filter(function(p){return p.status==='en-cours';}).length,
      comp=new Set(pieces.map(function(p){return p.composer;})).size;
  document.getElementById('statsBar').innerHTML=
    [[tot,'🎹','Morceaux','si-p'],[mai,'👏🏻','Maîtrisés','si-g'],[enc,'🎵','En cours','si-a'],[comp,'✍🏻','Compositeurs','si-r']]
    .map(function(x){return '<div class="stat"><div class="stat-icon '+x[3]+'">'+x[1]+'</div><div class="stat-text"><span class="stat-num">'+x[0]+'</span><span class="stat-label">'+x[2]+'</span></div></div>';}).join('');
  document.getElementById('fcount').textContent=data.length+' / '+tot+' morceaux';
  var wrap=document.getElementById('cardsWrap');
  if(!data.length){wrap.innerHTML='<div class="empty"><div style="font-size:48px;margin-bottom:16px">🎼</div>Aucun morceau trouvé</div>';return;}
  var ro=isRO();
  wrap.innerHTML=data.map(function(p,i){
    var hasPdf=!!p.pdfFile,hasVideo=!!p.videoUrl,footer='';
    if(hasPdf)footer+='<button class="btn-pdf" onclick="openPDF('+p._i+')">📄 Partition</button>';
    else if(!ro)footer+='<label class="btn-upload" style="cursor:pointer;"><input type="file" accept=".pdf" style="display:none" onchange="quickUploadPDF(event,'+p._i+')">📄 Ajouter partition</label>';
    if(hasVideo)footer+='<button class="btn-pdf" style="color:var(--red)" onclick="openVideo('+p._i+')">▶ Vidéo</button>';
    return '<div class="card" style="animation-delay:'+i*30+'ms">'
      +'<div class="card-top"><div class="badges">'
      +'<span class="badge b-'+p.status+'">'+SI[p.status]+' '+SL[p.status]+'</span>'
      +'<span class="badge b-'+p.level+'">'+LL[p.level]+'</span>'
      +'</div><div class="card-acts"'+(ro?' style="display:none"':'')+'>'
      +'<button class="ca" data-action="edit" data-idx="'+p._i+'">✏️</button>'
      +'<button class="ca del" data-action="del" data-idx="'+p._i+'">🗑</button>'
      +'</div></div>'
      +'<div class="card-title">'+esc(p.title)+'</div>'
      +'<div class="card-composer">'+cbadge(p.composer)+'</div>'
      +'<div class="card-meta">'+(p.startDate?'<span>📅 '+fmt(p.startDate)+(p.endDate?' → '+fmt(p.endDate):' → en cours')+'</span>':'')+'</div>'
      +(p.notes?'<div class="card-notes"><span class="ndot"></span>'+esc(p.notes)+'</div>':'')
      +(footer?'<div class="card-footer">'+footer+'</div>':'')
      +'</div>';
  }).join('');
}

document.addEventListener('click',function(e){
  var btn=e.target.closest('[data-action]');if(!btn)return;
  var idx=parseInt(btn.dataset.idx,10);
  if(btn.dataset.action==='edit')openModal(idx);
  if(btn.dataset.action==='del')showDel(idx);
  if(btn.dataset.action==='del-ok'){pieces.splice(delIdx,1);delIdx=null;document.getElementById('del-wrap').innerHTML='';renderCards();ghSave('Suppression');}
  if(btn.dataset.action==='del-cancel'){delIdx=null;document.getElementById('del-wrap').innerHTML='';}
});
function showDel(idx){
  delIdx=idx;var p=pieces[idx];
  document.getElementById('del-wrap').innerHTML='<div class="del-confirm"><span>Supprimer '+esc(p.title)+' ?</span>'
    +'<button class="btn-dc" data-action="del-ok">Supprimer</button>'
    +'<button class="btn-dcc" data-action="del-cancel">Annuler</button></div>';
}
function openModal(idx){
  editIdx=(idx!==undefined?idx:null);
  var p=editIdx!==null?pieces[editIdx]:null;
  pendingPdfB64=null;
  document.getElementById('modal-title').textContent=editIdx!==null?'Modifier le morceau':'Ajouter un morceau';
  document.getElementById('f-title').value=p?p.title:'';
  document.getElementById('f-composer').value=p?p.composer:'';
  document.getElementById('f-level').value=p?p.level:'intermediaire';
  document.getElementById('f-status').value=p?p.status:'en-cours';
  document.getElementById('f-start').value=p?p.startDate:new Date().toISOString().slice(0,10);
  document.getElementById('f-end').value=p?p.endDate:'';
  document.getElementById('f-notes').value=p?p.notes:'';
  document.getElementById('f-video').value=p?p.videoUrl||'':'';
  document.getElementById('f-pdf').value='';
  document.getElementById('pdf-name').textContent=p&&p.pdfFile?'Partition: '+p.pdfFile:'';
  document.getElementById('btn-del-pdf').style.display=p&&p.pdfFile?'block':'none';
  // Bloque le scroll arrière-plan sur iOS
  document.body.style.overflow='hidden';
  document.body.style.position='fixed';
  document.body.style.width='100%';
  document.getElementById('overlay').style.display='block';
  setTimeout(function(){document.getElementById('f-title').focus();},50);
}
function closeModal(){
  document.getElementById('overlay').style.display='none';
  editIdx=null;pendingPdfB64=null;
  document.body.style.overflow='';
  document.body.style.position='';
  document.body.style.width='';
}
function overlayClick(e){if(e.target===document.getElementById('overlay'))closeModal();}
function deletePdf(){
  if(!confirm('Supprimer la partition de ce morceau ?'))return;
  if(editIdx!==null){pieces[editIdx].pdfFile=null;ghSave('Suppression partition');renderCards();}
  document.getElementById('pdf-name').textContent='';
  document.getElementById('btn-del-pdf').style.display='none';
  toast('Partition supprimée','var(--green)');
}

async function savePiece(){
  var title=document.getElementById('f-title').value.trim(),composer=document.getElementById('f-composer').value.trim();
  if(!title||!composer){alert('Titre et compositeur sont obligatoires.');return;}
  document.getElementById('btn-save').disabled=true;document.getElementById('btn-save').textContent='Sauvegarde...';
  var d={title:title,composer:composer,level:document.getElementById('f-level').value,
    status:document.getElementById('f-status').value,startDate:document.getElementById('f-start').value,
    endDate:document.getElementById('f-end').value,notes:document.getElementById('f-notes').value.trim(),
    videoUrl:document.getElementById('f-video').value.trim()};
  if(editIdx!==null){d.pdfFile=pieces[editIdx].pdfFile||null;pieces[editIdx]=Object.assign({},pieces[editIdx],d);}
  else{d.pdfFile=null;pieces.push(d);}
  var newIdx=editIdx!==null?editIdx:pieces.length-1;
  if(pendingPdfB64){var fname=pdfFilename(pieces[newIdx]);var ok=await ghUploadPDF(fname,pendingPdfB64);if(ok)pieces[newIdx].pdfFile=fname;}
  closeModal();renderCards();
  await ghSave(editIdx!==null?'Modification':'Ajout');
  document.getElementById('btn-save').disabled=false;document.getElementById('btn-save').textContent='Enregistrer';
}

async function quickUploadPDF(e,idx){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=async function(ev){
    var b64=ev.target.result.split(',')[1],fname=pdfFilename(pieces[idx]);
    var ok=await ghUploadPDF(fname,b64);
    if(ok){pieces[idx].pdfFile=fname;await ghSave('Partition: '+pieces[idx].title);renderCards();}
  };
  reader.readAsDataURL(file);
}

document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closePDF();closeVideo();}});

// ── EXPORT PDF ──
function exportPDF(){
  if(!window.jspdf||!window.html2canvas){toast('Librairies non chargées','var(--amber)');return;}
  var btn=document.getElementById('btn-export');
  btn.textContent='⏳ Génération...';btn.disabled=true;
  var wrapper=document.createElement('div');
  wrapper.style.cssText='position:fixed;top:-9999px;left:0;width:1200px;background:#f7f5f2;';
  wrapper.appendChild(document.getElementById('app-header').cloneNode(true));
  wrapper.appendChild(document.getElementById('statsBar').cloneNode(true));
  document.body.appendChild(wrapper);
  html2canvas(wrapper,{scale:2,useCORS:true,logging:false,width:1200}).then(function(canvas){
    if(document.body.contains(wrapper))document.body.removeChild(wrapper);
    var imgData=canvas.toDataURL('image/png');
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    var margin=14,pageW=297,pageH=210;
    var colW=[100,52,32,32,52];
    var headers=['Titre','Compositeur','Statut','Niveau','Dates'];
    var imgW=pageW,imgH=Math.min((canvas.height/canvas.width)*imgW,44);
    var d=new Date(),dateStr=d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
    var sl={'en-cours':'En cours','maitrise':'Maitrise','a-revoir':'A revoir','en-pause':'En pause'};
    var ll={'debutant':'Debutant','intermediaire':'Intermediaire','avance':'Avance'};
    function safe(str){return String(str||'').replace(/[^\x20-\x7E]/g,function(c){var m={'\xe9':'e','\xe8':'e','\xea':'e','\xeb':'e','\xe0':'a','\xe2':'a','\xe4':'a','\xee':'i','\xef':'i','\xf4':'o','\xf6':'o','\xf9':'u','\xfb':'u','\xfc':'u','\xe7':'c','\xc9':'E','\xc8':'E','\xc0':'A','\xc2':'A','\xce':'I','\xd4':'O','\xd9':'U','\xdb':'U','\xc7':'C','\u2013':'-','\u2014':'-','\u2026':'...','\xa0':' ','\u2019':"'"};return m[c]!==undefined?m[c]:'';});}
    function ph(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
    function drawHeader(){
      doc.addImage(imgData,'PNG',0,0,imgW,imgH);
      doc.setFont('helvetica','italic');doc.setFontSize(7);doc.setTextColor(180,170,160);
      var ft='Export PDF du '+dateStr,fw=doc.getTextWidth(ft);
      doc.text(ft,pageW-margin-fw,pageH-4);
      doc.setDrawColor(220,215,210);doc.setLineWidth(0.2);doc.line(margin,pageH-8,pageW-margin,pageH-8);
      return imgH+4;
    }
    function drawTH(y){
      doc.setFillColor(240,237,232);doc.rect(margin,y,pageW-margin*2,7,'F');
      doc.setDrawColor(30,58,110);doc.setLineWidth(0.5);doc.line(margin,y,pageW-margin,y);
      doc.setTextColor(30,58,110);doc.setFontSize(8);doc.setFont('helvetica','bold');
      var x=margin;headers.forEach(function(h,i){doc.text(h,x+2,y+4.8);x+=colW[i];});
      doc.line(margin,y+7,pageW-margin,y+7);doc.setLineWidth(0.2);return y+7;
    }
    var y=drawHeader();y=drawTH(y);
    pieces.forEach(function(p,idx){
      var rowH=7;
      if(y+rowH>pageH-14){doc.addPage();y=drawHeader();y=drawTH(y);}
      if(idx%2===0){doc.setFillColor(249,248,246);doc.rect(margin,y,pageW-margin*2,rowH,'F');}
      doc.setTextColor(42,37,32);doc.setFont('helvetica','normal');doc.setFontSize(8);
      var x=margin;
      var cells=[safe(p.title),safe(p.composer),sl[p.status]||p.status,ll[p.level]||p.level,p.startDate?fmt(p.startDate)+(p.endDate?' > '+fmt(p.endDate):''):''];
      cells.forEach(function(cell,i){doc.text(doc.splitTextToSize(String(cell||''),colW[i]-3),x+2,y+4.5);x+=colW[i];});
      doc.setDrawColor(220,215,210);doc.line(margin,y+rowH,pageW-margin,y+rowH);y+=rowH;
    });
    var tlColors=['#a8c4e0','#f0b8a8','#a8d4b8','#f0d8a0','#d4b0cc','#a8d8d4','#f0c8a0','#b8d0a8','#c8b8e0','#f0b8c8'];
    var composerList=[...new Set(pieces.map(function(p){return p.composer;}))];
    var cmap={};composerList.forEach(function(c,i){cmap[c]=tlColors[i%tlColors.length];});
    var sySorted=pieces.filter(function(p){return p.startDate;}).map(function(p){var dd=new Date(p.startDate);return dd.getMonth()>=8?dd.getFullYear():dd.getFullYear()-1;});
    if(sySorted.length){
      var minSY=Math.min.apply(null,sySorted),maxSY=curSY(),now=new Date();
      var MN=['Sep','Oct','Nov','Dec','Jan','Fev','Mar','Avr','Mai','Jun','Jul','Aou'];
      for(var sy=minSY;sy<=maxSY;sy++){
        doc.addPage();var y=drawHeader();
        var start=new Date(sy,8,1),end=new Date(sy+1,7,31,23,59,59),total=end-start;
        doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(30,58,110);
        doc.text('Timeline '+sy+' - '+(sy+1),margin,y+7);y+=14;
        var lblW=90,barX=margin+lblW,barW=pageW-margin*2-lblW,isCur=sy===curSY();
        doc.setFontSize(7);doc.setFont('helvetica','normal');
        MN.forEach(function(m,i){
          var mi=(8+i)%12,my=mi>=8?sy:sy+1,cur=isCur&&mi===now.getMonth()&&my===now.getFullYear();
          doc.setTextColor(cur?30:140,cur?58:132,cur?110:124);
          doc.text(m,barX+i*(barW/12)+(barW/24)-doc.getTextWidth(m)/2,y);
        });
        doc.setDrawColor(220,215,210);doc.setLineWidth(0.2);doc.line(barX,y+1,barX+barW,y+1);y+=6;
        var nowX=isCur?barX+((now-start)/total)*barW:null;
        var active=pieces.filter(function(p){if(!p.startDate)return false;var ps=new Date(p.startDate),pe=p.endDate?new Date(p.endDate):now;return ps<=end&&pe>=start;}).sort(function(a,b){return(a.startDate||'').localeCompare(b.startDate||'');});
        if(!active.length){doc.setFontSize(9);doc.setTextColor(160,160,160);doc.text('Aucun morceau',margin,y+8);}
        else{active.forEach(function(p){
          if(y>pageH-22)return;
          var ps=new Date(p.startDate),pe=p.endDate?new Date(p.endDate):now;
          var cs=Math.max(ps,start),ce=Math.min(pe,end);
          var left=((cs-start)/total)*barW,wid=Math.max(2,((ce-cs)/total)*barW);
          var rgb=ph(cmap[p.composer]||'#a8c4e0');
          doc.setFontSize(7.5);doc.setTextColor(42,37,32);doc.setFont('helvetica','normal');
          doc.text(safe(p.title.length>46?p.title.slice(0,44)+'...':p.title),margin,y+4);
          doc.setFillColor(rgb[0],rgb[1],rgb[2]);doc.roundedRect(barX+left,y,wid,5,1,1,'F');
          if(nowX){doc.setDrawColor(30,58,110);doc.setLineWidth(0.5);doc.line(nowX,y-1,nowX,y+6);doc.setLineWidth(0.2);}
          y+=8;
        });}
        y+=4;doc.setFontSize(7);doc.setFont('helvetica','bold');doc.setTextColor(100,96,92);
        doc.text('Compositeurs :',margin,y);y+=5;var lx=margin;
        composerList.forEach(function(c){
          var rgb=ph(cmap[c]||'#a8c4e0');
          doc.setFillColor(rgb[0],rgb[1],rgb[2]);doc.roundedRect(lx,y-3,3,3,0.5,0.5,'F');
          doc.setTextColor(42,37,32);doc.setFont('helvetica','normal');doc.setFontSize(7);
          var cs=safe(c);doc.text(cs,lx+5,y);lx+=doc.getTextWidth(cs)+12;
          if(lx>pageW-margin-30){lx=margin;y+=5;}
        });
      }
    }
    doc.save('repertoire-piano.pdf');
    toast('PDF téléchargé !','var(--green)');
    btn.textContent='⬇ Export PDF';btn.disabled=false;
  }).catch(function(err){
    if(document.body.contains(wrapper))document.body.removeChild(wrapper);
    toast('Erreur: '+err.message,'var(--red)');
    btn.textContent='⬇ Export PDF';btn.disabled=false;
  });
}

function curSY(){var n=new Date();return n.getMonth()>=8?n.getFullYear():n.getFullYear()-1;}
function syS(sy){return new Date(sy,8,1);}
function syE(sy){return new Date(sy+1,7,31,23,59,59);}
function changeYear(d){tlSY+=d;renderTL();}
function renderTL(){
  tlCM={};
  var start=syS(tlSY),end=syE(tlSY),total=end-start,now=new Date();
  var sySorted=pieces.filter(function(p){return p.startDate;}).map(function(p){var d=new Date(p.startDate);return d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;});
  var minSY=sySorted.length?Math.min.apply(null,sySorted):tlSY,maxSY=curSY();
  document.getElementById('yr-lbl').textContent=tlSY+' - '+(tlSY+1);
  document.getElementById('btn-prev').disabled=tlSY<=minSY;
  document.getElementById('btn-next').disabled=tlSY>=maxSY;
  document.getElementById('tl-leg').innerHTML=[...new Set(pieces.map(function(p){return p.composer;}))].map(function(c){return '<span class="leg-item"><span class="leg-dot" style="background:'+tlC(c)+'"></span>'+esc(c)+'</span>';}).join('');
  var active=pieces.map(function(p,i){return Object.assign({},p,{_i:i});}).filter(function(p){if(!p.startDate)return false;var s=new Date(p.startDate),e=p.endDate?new Date(p.endDate):now;return s<=end&&e>=start;}).sort(function(a,b){return(a.startDate||'').localeCompare(b.startDate||'');});
  var grid=document.getElementById('tl-grid');
  if(!active.length){grid.innerHTML='<div class="tl-empty">Aucun morceau sur cette période</div>';return;}
  var isCur=tlSY===curSY(),nowPct=isCur?(((now-start)/total)*100).toFixed(2):null;
  var MN=['Sep','Oct','Nov','Déc','Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû'];
  var mh='<div class="tl-mrow">'+MN.map(function(m,i){var mi=(8+i)%12,my=mi>=8?tlSY:tlSY+1,cur=isCur&&mi===now.getMonth()&&my===now.getFullYear();return '<div class="tl-m'+(cur?' now':'')+'">'+m+'</div>';}).join('')+'</div>';
  var rows=active.map(function(p){
    var s=new Date(p.startDate),e=p.endDate?new Date(p.endDate):now;
    var cs=Math.max(s,start),ce=Math.min(e,end);
    var left=((cs-start)/total*100).toFixed(2),wid=Math.max(0.5,((ce-cs)/total*100)).toFixed(2);
    var col=tlC(p.composer),nl=nowPct?'<div class="tl-now" style="left:'+nowPct+'%"></div>':'';
    var st=p.title.length>28?p.title.slice(0,26)+'...':p.title;
    return '<div class="tl-row"><div class="tl-lbl"><span class="tl-lt">'+esc(st)+'</span><span class="tl-lc">'+esc(p.composer)+'</span></div>'
      +'<div class="tl-ba">'+nl+'<div class="tl-bar" style="left:'+left+'%;width:'+wid+'%;background:'+col+';" onmouseenter="showTip(event,'+p._i+')" onmouseleave="hideTip()" onmousemove="moveTip(event)"></div></div></div>';
  }).join('');
  grid.innerHTML=mh+rows;
}
function showTip(e,idx){
  var p=pieces[idx];if(!p)return;
  var notes=p.notes?'<br><span style="font-size:11px;color:var(--text2)">'+esc(p.notes.slice(0,80))+(p.notes.length>80?'...':'')+'</span>':'';
  document.getElementById('tooltip').innerHTML='<strong>'+esc(p.title)+'</strong><em>'+esc(p.composer)+'</em><br>'+(fmt(p.startDate)||'?')+' → '+(p.endDate?fmt(p.endDate):'En cours')+notes;
  document.getElementById('tooltip').style.display='block';moveTip(e);
}
function moveTip(e){var t=document.getElementById('tooltip');t.style.left=(e.clientX+14)+'px';t.style.top=(e.clientY-8)+'px';}
function hideTip(){document.getElementById('tooltip').style.display='none';}

ghLoad();
</script>
