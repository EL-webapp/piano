<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R\u00e9pertoire Piano \u2014 Elise</title>
<style>
:root {
  --bg:#f7f5f2; --surface:#ffffff; --surface2:#f0ede8; --border:#e8e3dc;
  --text:#2a2520; --text2:#7a7068; --text3:#b0a898;
  --accent:#1e3a6e; --accent-soft:#e0e8f5;
  --accent2:#c97b5a; --accent2-soft:#faeee7;
  --green:#5a9e7c; --green-soft:#e6f4ed;
  --amber:#c49a3a; --amber-soft:#fdf3df;
  --red:#c0564a; --red-soft:#fcecea;
  --shadow:0 2px 12px rgba(0,0,0,0.06); --shadow-lg:0 8px 32px rgba(0,0,0,0.10);
  --radius:16px; --radius-sm:10px;
  --font-serif:Georgia,'Times New Roman',serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"] {
  --bg:#18171a; --surface:#232228; --surface2:#2c2b32; --border:#35333d;
  --text:#f0eee9; --text2:#a09898; --text3:#5a5560;
  --accent:#2a4a8a; --accent-soft:#dde6f5;
  --accent2:#d4906c; --accent2-soft:#3a2820;
  --green:#6abf92; --green-soft:#1a2e24;
  --amber:#d4ae5a; --amber-soft:#2e2616;
  --red:#d47068; --red-soft:#2e1a18;
  --shadow:0 2px 12px rgba(0,0,0,0.3); --shadow-lg:0 8px 32px rgba(0,0,0,0.4);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh;transition:background .3s,color .3s;}

.header{background:var(--surface);border-bottom:1px solid var(--border);padding:28px 32px 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.header-eyebrow{font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.header-title{font-family:var(--font-serif);font-size:clamp(32px,5vw,48px);font-weight:600;line-height:1.1;}
.header-title span{color:var(--accent);font-style:italic;}
.header-sub{font-size:13px;color:var(--text2);margin-top:6px;font-weight:300;}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sync-status{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);}
.sync-dot.ok{background:var(--green);}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn-theme{background:var(--surface2);border:1px solid var(--border);color:var(--text2);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .2s;flex-shrink:0;}
.btn-theme:hover{border-color:var(--accent);color:var(--accent);}

.stats{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;overflow-x:auto;}
.stat{display:flex;align-items:center;gap:10px;padding:16px 24px 16px 0;margin-right:24px;border-right:1px solid var(--border);flex-shrink:0;}
.stat:last-child{border-right:none;}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.stat-icon.purple{background:var(--accent-soft);}
.stat-icon.green{background:var(--green-soft);}
.stat-icon.amber{background:var(--amber-soft);}
.stat-icon.rose{background:var(--red-soft);}
.stat-num{font-family:var(--font-serif);font-size:22px;font-weight:600;color:var(--text);line-height:1;display:block;}
.stat-label{font-size:11px;color:var(--text2);display:block;margin-top:2px;}

.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;}
.tab-btn{background:none;border:none;color:var(--text2);font-family:var(--font-sans);font-size:13px;font-weight:500;padding:14px 4px;margin-right:28px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;margin-bottom:-1px;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

.controls{display:flex;gap:10px;padding:20px 32px;background:var(--bg);flex-wrap:wrap;align-items:center;}
.search-wrap{flex:1;min-width:180px;position:relative;}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 14px 10px 38px;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;}
.search-wrap input::placeholder{color:var(--text3);}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none;}
.filter-select{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:13px;outline:none;cursor:pointer;transition:border-color .2s;}
.filter-select:focus{border-color:var(--accent);}
.btn-primary{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:13px;font-weight:500;cursor:pointer;transition:opacity .2s;white-space:nowrap;}
.btn-primary:hover{opacity:.88;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-secondary{background:var(--surface);color:var(--text2);border:1px solid var(--border);padding:10px 16px;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-auth{font-size:11px;padding:7px 12px;}

.cards-wrap{padding:0 32px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s;animation:cardIn .25s ease forwards;opacity:0;position:relative;}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
.card-badges{display:flex;gap:6px;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;}
.badge-en-cours{background:var(--amber-soft);color:var(--amber);}
.badge-maitrise{background:var(--green-soft);color:var(--green);}
.badge-a-revoir{background:var(--red-soft);color:var(--red);}
.badge-en-pause{background:var(--surface2);color:var(--text2);}
.badge-debutant{background:var(--green-soft);color:var(--green);}
.badge-intermediaire{background:var(--accent-soft);color:var(--accent);}
.badge-avance{background:var(--accent2-soft);color:var(--accent2);}
.card-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s;flex-shrink:0;}
.card:hover .card-actions{opacity:1;}
.card-action{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:4px 7px;border-radius:6px;transition:all .15s;}
.card-action:hover{background:var(--surface2);color:var(--text);}
.card-action.del:hover{background:var(--red-soft);color:var(--red);}
.card-title{font-family:var(--font-serif);font-size:16px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:8px;}
.card-composer{margin-bottom:12px;}
.card-meta{display:flex;gap:16px;flex-wrap:wrap;}
.card-meta-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);}
.card-notes{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);line-height:1.5;font-style:italic;}
.card-notes-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle;}
.empty-state{grid-column:1/-1;text-align:center;padding:80px 24px;color:var(--text3);}

.tl-controls{display:flex;align-items:center;gap:16px;padding:20px 32px;background:var(--bg);flex-wrap:wrap;}
.year-nav{display:flex;align-items:center;gap:10px;}
.btn-yr{background:var(--surface);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .15s;}
.btn-yr:hover{border-color:var(--accent);color:var(--accent);}
.btn-yr:disabled{opacity:.25;cursor:default;pointer-events:none;}
.yr-label{font-family:var(--font-serif);font-size:20px;font-weight:600;min-width:120px;text-align:center;}
.tl-legend{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tl-wrap{padding:0 32px 32px;overflow-x:auto;}
.tl-inner{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);min-width:520px;}
.tl-month-row{display:flex;padding-left:200px;border-bottom:1px solid var(--border);background:var(--surface2);}
.tl-m{flex:1;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-align:center;padding:10px 0;}
.tl-m.now{color:var(--accent);font-weight:600;}
.tl-row{display:flex;align-items:center;min-height:44px;border-bottom:1px solid var(--border);transition:background .12s;}
.tl-row:last-child{border-bottom:none;}
.tl-row:hover{background:var(--surface2);}
.tl-lbl{width:200px;min-width:200px;padding:8px 16px 8px 20px;}
.tl-lbl-title{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.tl-lbl-composer{font-size:11px;color:var(--text3);font-style:italic;display:block;}
.tl-bar-area{flex:1;position:relative;height:36px;padding-right:16px;}
.tl-bar{position:absolute;top:50%;transform:translateY(-50%);height:10px;border-radius:6px;cursor:pointer;transition:height .15s;min-width:4px;}
.tl-bar:hover{height:18px;}
.tl-now-line{position:absolute;top:0;bottom:0;width:1.5px;background:var(--accent);opacity:.4;pointer-events:none;border-radius:2px;}
.tl-empty{text-align:center;padding:48px;font-size:13px;color:var(--text3);}

.tooltip{position:fixed;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:var(--radius-sm);font-size:12px;pointer-events:none;z-index:300;max-width:260px;display:none;box-shadow:var(--shadow-lg);}
.tooltip strong{display:block;font-family:var(--font-serif);font-size:14px;margin-bottom:4px;}
.tooltip em{color:var(--text2);font-style:italic;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fadeO .15s ease;backdrop-filter:blur(4px);}
@keyframes fadeO{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);max-width:500px;width:100%;box-shadow:var(--shadow-lg);animation:slideM .2s ease;}
@keyframes slideM{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hd{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 18px;border-bottom:1px solid var(--border);}
.modal-hd h2{font-family:var(--font-serif);font-size:20px;font-weight:600;}
.btn-x{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s;line-height:1;}
.btn-x:hover{background:var(--surface2);color:var(--text);}
.modal-body{padding:22px 24px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;}
.field input::placeholder,.field textarea::placeholder{color:var(--text3);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field textarea{resize:vertical;min-height:72px;}
.field select option{background:var(--surface);}
.modal-ft{padding:16px 24px 20px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--border);}

.delete-confirm{background:var(--red-soft);border:1px solid var(--red);border-radius:var(--radius-sm);padding:14px 16px;margin:0 32px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.delete-confirm span{font-size:13px;color:var(--red);flex:1;}
.btn-del-confirm{background:var(--red);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-family:var(--font-sans);font-size:12px;font-weight:500;cursor:pointer;}
.btn-del-cancel{background:none;border:1px solid var(--border);color:var(--text2);padding:8px 14px;border-radius:8px;font-family:var(--font-sans);font-size:12px;cursor:pointer;}

.footer{border-top:1px solid var(--border);padding:12px 32px;font-size:11px;color:var(--text3);display:flex;justify-content:space-between;background:var(--surface);}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-radius:var(--radius-sm);padding:12px 18px;font-size:13px;box-shadow:var(--shadow-lg);z-index:400;animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:600px){
  .header,.controls,.cards-wrap,.tl-controls,.tl-wrap{padding-left:16px;padding-right:16px;}
  .stats,.tabs{padding:0 16px;}
  .form-grid{grid-template-columns:1fr;}
  .field.full{grid-column:1;}
  .delete-confirm{margin:0 16px 14px;}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-eyebrow">Journal de pratique</div>
    <div class="header-title">Mon <span>R&eacute;pertoire</span></div>
    <div class="header-sub">Elise &amp; Camille G. &mdash; depuis octobre 2021</div>
  </div>
  <div class="header-right">
    <div class="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">Chargement&hellip;</span></div>
    <button class="btn-secondary btn-auth" id="btn-auth" onclick="toggleAuth()">&#128275; Connexion</button>
    <button class="btn-theme" onclick="toggleTheme()" id="btn-theme">&#127769;</button>
  </div>
</div>

<div class="stats" id="statsBar"></div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('liste')">Morceaux</button>
  <button class="tab-btn" onclick="switchTab('timeline')">Timeline</button>
</div>

<div id="tab-liste">
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">&#9833;</span>
      <input type="text" id="searchInput" placeholder="Rechercher un titre, un compositeur&hellip;" oninput="renderCards()">
    </div>
    <select class="filter-select" id="filterStatus" onchange="renderCards()">
      <option value="">Tous statuts</option>
      <option value="en-cours">En cours</option>
      <option value="maitrise">Ma&icirc;tris&eacute;</option>
      <option value="a-revoir">&Agrave; revoir</option>
      <option value="en-pause">En pause</option>
    </select>
    <select class="filter-select" id="filterLevel" onchange="renderCards()">
      <option value="">Tous niveaux</option>
      <option value="debutant">D&eacute;butant</option>
      <option value="intermediaire">Interm&eacute;diaire</option>
      <option value="avance">Avanc&eacute;</option>
    </select>
    <button class="btn-primary" id="btn-add" onclick="openModal()">+ Ajouter</button>
    <button class="btn-secondary" onclick="exportPDF()">&#8615; Export PDF</button>
  </div>
  <div id="delete-confirm-wrap"></div>
  <div class="cards-wrap" id="cardsWrap"></div>
  <div class="footer">
    <span id="footer-count"></span>
    <span id="footer-last-sync"></span>
  </div>
</div>

<div id="tab-timeline" style="display:none">
  <div class="tl-controls">
    <div class="year-nav">
      <button class="btn-yr" id="btn-prev" onclick="changeYear(-1)">&#8249;</button>
      <span class="yr-label" id="yr-label"></span>
      <button class="btn-yr" id="btn-next" onclick="changeYear(1)">&#8250;</button>
    </div>
    <div class="tl-legend" id="tl-legend"></div>
  </div>
  <div class="tl-wrap">
    <div class="tl-inner" id="tl-grid"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<div class="overlay" id="overlay" style="display:none" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-hd">
      <h2 id="modal-title">Ajouter un morceau</h2>
      <button class="btn-x" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field full"><label>Titre *</label><input type="text" id="f-title" placeholder="ex. Nocturne en mi b&eacute;mol op.9 n&deg;2"></div>
        <div class="field"><label>Compositeur *</label><input type="text" id="f-composer" placeholder="ex. Chopin"></div>
        <div class="field"><label>Niveau</label>
          <select id="f-level">
            <option value="debutant">D&eacute;butant</option>
            <option value="intermediaire" selected>Interm&eacute;diaire</option>
            <option value="avance">Avanc&eacute;</option>
          </select>
        </div>
        <div class="field"><label>Statut</label>
          <select id="f-status">
            <option value="en-cours">En cours</option>
            <option value="maitrise">Ma&icirc;tris&eacute;</option>
            <option value="a-revoir">&Agrave; revoir</option>
            <option value="en-pause">En pause</option>
          </select>
        </div>
        <div class="field"><label>Date de d&eacute;but</label><input type="date" id="f-start"></div>
        <div class="field"><label>Date de fin / MAJ</label><input type="date" id="f-end"></div>
        <div class="field full"><label>Notes</label><textarea id="f-notes" placeholder="Tempo, conseils, observations&hellip;"></textarea></div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn-primary" onclick="savePiece()">Enregistrer</button>
    </div>
  </div>
</div>

<script>

function setToken(t) { localStorage.setItem('gh_token', t); }

  {title:"Reverie",composer:"Debussy",level:"intermediaire",status:"en-pause",startDate:"2021-10-14",endDate:"2022-01-06",notes:""},
  {title:"Suite Francaise III (Si min) BWV 814",composer:"J.S. Bach",level:"intermediaire",status:"en-pause",startDate:"2021-11-25",endDate:"2022-03-10",notes:""},
  {title:"Carnaval Op.9 - Chiarina & Chopin",composer:"R. Schumann",level:"intermediaire",status:"en-pause",startDate:"2022-01-06",endDate:"2022-02-24",notes:""},
  {title:"6 variations sur le theme de la Molinera",composer:"Beethoven",level:"debutant",status:"en-pause",startDate:"2022-02-10",endDate:"2022-04-28",notes:""},
  {title:"Danzas Espanolas - Oriental & Andaluza",composer:"Granados",level:"intermediaire",status:"en-pause",startDate:"2022-03-24",endDate:"2022-06-23",notes:""},
  {title:"Sonate 19 (Mi min) Hoboken XVI:47",composer:"Haydn",level:"intermediaire",status:"en-pause",startDate:"2022-06-16",endDate:"2022-09-29",notes:""}
];

var TL_COLORS = ['#a8c4e0','#f0b8a8','#a8d4b8','#f0d8a0','#d4b0cc','#a8d8d4','#f0c8a0','#b8d0a8','#c8b8e0','#f0b8c8'];
var C_COLORS = [
  {bg:'#dce8f5',text:'#1a3a6a'},{bg:'#fde8d8',text:'#7a3010'},
  {bg:'#f0e8f8',text:'#4a2080'},{bg:'#e0f0f0',text:'#1a5858'},
  {bg:'#fdf0d8',text:'#6a4008'},{bg:'#f8e8f0',text:'#7a1848'},
  {bg:'#e8eef8',text:'#1a2860'},{bg:'#f8f0e0',text:'#5a3808'},
  {bg:'#e8f8f8',text:'#0a5050'},{bg:'#f0e0f8',text:'#501870'}
];
var tlColorMap = {}, cColorMap = {}, tlSY = currentSY();

function tlColorFor(c) { if(!tlColorMap[c]) tlColorMap[c]=TL_COLORS[Object.keys(tlColorMap).length%TL_COLORS.length]; return tlColorMap[c]; }
function cColorFor(c)  { if(!cColorMap[c])  cColorMap[c]=C_COLORS[Object.keys(cColorMap).length%C_COLORS.length]; return cColorMap[c]; }
function composerBadge(c) { var col=cColorFor(c); return '<span class="badge" style="background:'+col.bg+';color:'+col.text+'">'+esc(c)+'</span>'; }

var SL = {'en-cours':'En cours','maitrise':'Ma\u00eetris\u00e9','a-revoir':'\u00c0 revoir','en-pause':'En pause'};
var LL = {'debutant':'D\u00e9butant','intermediaire':'Interm\u00e9diaire','avance':'Avanc\u00e9'};
var SI = {'en-cours':'\u{1F3B5}','maitrise':'\u2713','a-revoir':'\u21BA','en-pause':'\u23F8'};

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(d) { if(!d) return null; var p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

function showToast(msg, color) {
  var t=document.createElement('div'); t.className='toast';
  if(color) t.style.borderLeftColor=color;
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){t.remove();}, 3000);
}
function setSyncStatus(state, label) {
  document.getElementById('sync-dot').className='sync-dot '+state;
  document.getElementById('sync-label').textContent=label;
}
function updateFooterSync() {
  if(!lastSync) return;
  var h=lastSync.getHours().toString().padStart(2,'0'), m=lastSync.getMinutes().toString().padStart(2,'0');
  document.getElementById('footer-last-sync').textContent='Derni\u00e8re sync '+h+':'+m;
}

function isReadOnly() { return !getToken(); }

function updateAuthBtn() {
  var btn=document.getElementById('btn-auth');
  if(getToken()) {
    btn.textContent='\uD83D\uDD12 \u00c9criture'; btn.style.color='var(--green)'; btn.style.borderColor='var(--green)';
  } else {
    btn.textContent='\uD83D\uDD13 Connexion'; btn.style.color=''; btn.style.borderColor='';
  }
}

function updateReadOnlyUI() {
  updateAuthBtn();
  var btnAdd=document.getElementById('btn-add');
  if(isReadOnly()) {
    btnAdd.disabled=true; btnAdd.title='Mode lecture seule';
  } else {
    btnAdd.disabled=false; btnAdd.title='';
  }
}

function toggleAuth() {
  if(getToken()) {
    if(confirm('Se d\u00e9connecter du mode \u00e9criture ?')) {
      localStorage.removeItem('gh_token'); location.reload();
    }
  } else {
    var t=prompt('Entre ton token GitHub pour passer en mode \u00e9criture :');
    if(t && t.trim()) { setToken(t.trim()); location.reload(); }
  }
}

function toggleTheme() {
  var html=document.documentElement, isDark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme', isDark?'light':'dark');
  document.getElementById('btn-theme').textContent=isDark?'\uD83C\uDF19':'\u2600\uFE0F';
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(function(b,i){ b.classList.toggle('active',['liste','timeline'][i]===name); });
  document.getElementById('tab-liste').style.display    =name==='liste'?'block':'none';
  document.getElementById('tab-timeline').style.display =name==='timeline'?'block':'none';
  if(name==='timeline') renderTimeline();
}

async function ghLoad() {
  setSyncStatus('syncing','Chargement\u2026');
  try {
    var r=await fetch(GH_API+'?t='+Date.now(), {headers:{Accept:'application/vnd.github.v3+json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var data=await r.json();
    fileSha=data.sha;
    var content=JSON.parse(atob(data.content.replace(/\n/g,'')));
    pieces=content.length?content:BAKED.map(function(p){return Object.assign({},p);});
    if(!content.length && getToken()) await ghSave('Initialisation');
    lastSync=new Date();
    setSyncStatus('ok', isReadOnly()?'Lecture seule':'Synchronis\u00e9');
    updateFooterSync();
  } catch(e) {
    setSyncStatus('error','Erreur');
    try { var s=localStorage.getItem('piano_rep_v3'); pieces=s?JSON.parse(s):BAKED.map(function(p){return Object.assign({},p);}); } catch(e2) { pieces=BAKED.map(function(p){return Object.assign({},p);}); }
    showToast('\u26a0\ufe0f Mode hors-ligne','var(--amber)');
  }
  renderCards();
  updateReadOnlyUI();
}

async function ghSave(msg) {
  if(!msg) msg='Mise \u00e0 jour';
  var token=getToken();
  if(!token) { localStorage.setItem('piano_rep_v3',JSON.stringify(pieces)); showToast('\u26a0\ufe0f Sauvegarde locale','var(--amber)'); return; }
  setSyncStatus('syncing','Sauvegarde\u2026');
  try {
    var body={message:msg, content:btoa(unescape(encodeURIComponent(JSON.stringify(pieces,null,2)))), committer:{name:'Elise',email:GH_EMAIL}};
    if(fileSha) body.sha=fileSha;
    var r=await fetch(GH_API,{method:'PUT',headers:{Authorization:'token '+token,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var data=await r.json();
    fileSha=data.content.sha;
    lastSync=new Date(); setSyncStatus('ok','Synchronis\u00e9'); updateFooterSync();
    localStorage.setItem('piano_rep_v3',JSON.stringify(pieces));
    showToast('\u2713 Sauvegard\u00e9','var(--green)');
  } catch(e) {
    setSyncStatus('error','Erreur');
    localStorage.setItem('piano_rep_v3',JSON.stringify(pieces));
    showToast('\u26a0\ufe0f Sauvegarde locale','var(--amber)');
  }
}

function getFiltered() {
  var q=document.getElementById('searchInput').value.toLowerCase();
  var st=document.getElementById('filterStatus').value;
  var lv=document.getElementById('filterLevel').value;
  return pieces.map(function(p,i){return Object.assign({},p,{_i:i});}).filter(function(p){
    var mQ=!q||p.title.toLowerCase().includes(q)||p.composer.toLowerCase().includes(q);
    return mQ&&(!st||p.status===st)&&(!lv||p.level===lv);
  }).sort(function(a,b){return (a.startDate||'').localeCompare(b.startDate||'');});
}

function renderCards() {
  cColorMap={};
  var data=getFiltered();
  var tot=pieces.length, mai=pieces.filter(function(p){return p.status==='maitrise';}).length,
      enc=pieces.filter(function(p){return p.status==='en-cours';}).length,
      comp=new Set(pieces.map(function(p){return p.composer;})).size;
  document.getElementById('statsBar').innerHTML=
    [[tot,'\uD83C\uDFB9','Morceaux','purple'],[mai,'\u2713','Ma\u00eetris\u00e9s','green'],[enc,'\uD83C\uDFB5','En cours','amber'],[comp,'\u266A','Compositeurs','rose']]
    .map(function(x){return '<div class="stat"><div class="stat-icon '+x[3]+'">'+x[1]+'</div><div class="stat-text"><span class="stat-num">'+x[0]+'</span><span class="stat-label">'+x[2]+'</span></div></div>';}).join('');
  document.getElementById('footer-count').textContent=data.length+' / '+tot+' morceaux';
  var wrap=document.getElementById('cardsWrap');
  if(!data.length){wrap.innerHTML='<div class="empty-state"><span style="font-size:48px;display:block;margin-bottom:16px;">\uD834\uDD3D</span><span style="font-size:14px;">Aucun morceau trouv\u00e9</span></div>';return;}
  var ro=isReadOnly();
  wrap.innerHTML=data.map(function(p,i){
    var statusClass='badge-'+p.status;
    var levelClass='badge-'+p.level;
    return '<div class="card" style="animation-delay:'+i*30+'ms">'
      +'<div class="card-top">'
      +'<div class="card-badges">'
      +'<span class="badge '+statusClass+'">'+(SI[p.status]||'')+' '+(SL[p.status]||p.status)+'</span>'
      +'<span class="badge '+levelClass+'">'+(LL[p.level]||p.level)+'</span>'
      +'</div>'
      +'<div class="card-actions" style="'+(ro?'display:none':'')+'">'
      +'<button class="card-action" data-action="edit" data-idx="'+p._i+'" title="Modifier">\u270F\uFE0F</button>'
      +'<button class="card-action del" data-action="del" data-idx="'+p._i+'" title="Supprimer">\uD83D\uDDD1</button>'
      +'</div>'
      +'</div>'
      +'<div class="card-title">'+esc(p.title)+'</div>'
      +'<div class="card-composer">'+composerBadge(p.composer)+'</div>'
      +'<div class="card-meta">'+(p.startDate?'<span class="card-meta-item">\uD83D\uDCC5 '+fmt(p.startDate)+(p.endDate?' \u2192 '+fmt(p.endDate):' \u2192 en cours')+'</span>':'')+'</div>'
      +(p.notes?'<div class="card-notes"><span class="card-notes-dot"></span>'+esc(p.notes)+'</div>':'')
      +'</div>';
  }).join('');
}

document.addEventListener('click',function(e){
  var btn=e.target.closest('[data-action]'); if(!btn) return;
  var idx=parseInt(btn.dataset.idx,10);
  if(btn.dataset.action==='edit') openModal(idx);
  if(btn.dataset.action==='del') showDeleteConfirm(idx);
  if(btn.dataset.action==='del-confirm'){pieces.splice(pendingDeleteIdx,1);pendingDeleteIdx=null;document.getElementById('delete-confirm-wrap').innerHTML='';renderCards();ghSave('Suppression');}
  if(btn.dataset.action==='del-cancel'){pendingDeleteIdx=null;document.getElementById('delete-confirm-wrap').innerHTML='';}
});

function showDeleteConfirm(idx) {
  pendingDeleteIdx=idx; var p=pieces[idx];
  document.getElementById('delete-confirm-wrap').innerHTML=
    '<div class="delete-confirm"><span>Supprimer &laquo; '+esc(p.title)+' &raquo; ?</span>'
    +'<button class="btn-del-confirm" data-action="del-confirm">Supprimer</button>'
    +'<button class="btn-del-cancel" data-action="del-cancel">Annuler</button></div>';
}

function openModal(idx) {
  editingIdx=(idx!==undefined?idx:null);
  var p=editingIdx!==null?pieces[editingIdx]:null;
  document.getElementById('modal-title').textContent=editingIdx!==null?'Modifier le morceau':'Ajouter un morceau';
  document.getElementById('f-title').value   =p?p.title:'';
  document.getElementById('f-composer').value=p?p.composer:'';
  document.getElementById('f-level').value   =p?p.level:'intermediaire';
  document.getElementById('f-status').value  =p?p.status:'en-cours';
  document.getElementById('f-start').value   =p?p.startDate:new Date().toISOString().slice(0,10);
  document.getElementById('f-end').value     =p?p.endDate:'';
  document.getElementById('f-notes').value   =p?p.notes:'';
  document.getElementById('overlay').style.display='flex';
  setTimeout(function(){document.getElementById('f-title').focus();},50);
}
function closeModal(){document.getElementById('overlay').style.display='none';editingIdx=null;}
function overlayClick(e){if(e.target===document.getElementById('overlay'))closeModal();}
function savePiece(){
  var title=document.getElementById('f-title').value.trim();
  var composer=document.getElementById('f-composer').value.trim();
  if(!title||!composer){alert('Titre et compositeur sont obligatoires.');return;}
  var d={title:title,composer:composer,level:document.getElementById('f-level').value,status:document.getElementById('f-status').value,startDate:document.getElementById('f-start').value,endDate:document.getElementById('f-end').value,notes:document.getElementById('f-notes').value.trim()};
  if(editingIdx!==null) pieces[editingIdx]=Object.assign({},pieces[editingIdx],d);
  else pieces.push(d);
  closeModal(); renderCards();
  ghSave(editingIdx!==null?'Modification':'Ajout');
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
function exportPDF(){window.print();}

function currentSY(){var n=new Date();return n.getMonth()>=8?n.getFullYear():n.getFullYear()-1;}
function syStart(sy){return new Date(sy,8,1);}
function syEnd(sy){return new Date(sy+1,7,31,23,59,59);}
function syLabel(sy){return sy+' \u2013 '+(sy+1);}
function changeYear(d){tlSY+=d;renderTimeline();}

function renderTimeline(){
  tlColorMap={};
  var start=syStart(tlSY),end=syEnd(tlSY),total=end-start,now=new Date();
  var sySorted=pieces.filter(function(p){return p.startDate;}).map(function(p){var d=new Date(p.startDate);return d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;});
  var minSY=sySorted.length?Math.min.apply(null,sySorted):tlSY, maxSY=currentSY();
  document.getElementById('yr-label').textContent=syLabel(tlSY);
  document.getElementById('btn-prev').disabled=tlSY<=minSY;
  document.getElementById('btn-next').disabled=tlSY>=maxSY;
  document.getElementById('tl-legend').innerHTML=[...new Set(pieces.map(function(p){return p.composer;}))].map(function(c){return '<span class="leg-item"><span class="leg-dot" style="background:'+tlColorFor(c)+'"></span>'+esc(c)+'</span>';}).join('');
  var active=pieces.map(function(p,i){return Object.assign({},p,{_i:i});}).filter(function(p){
    if(!p.startDate)return false;
    var s=new Date(p.startDate),e=p.endDate?new Date(p.endDate):now;
    return s<=end&&e>=start;
  }).sort(function(a,b){return (a.startDate||'').localeCompare(b.startDate||'');});
  var grid=document.getElementById('tl-grid');
  if(!active.length){grid.innerHTML='<div class="tl-empty">Aucun morceau sur cette p\u00e9riode</div>';return;}
  var isCur=tlSY===currentSY(), nowPct=isCur?(((now-start)/total)*100).toFixed(2):null;
  var mNames=['Sep','Oct','Nov','D\u00e9c','Jan','F\u00e9v','Mar','Avr','Mai','Jun','Jul','Ao\u00fb'];
  var mHeader='<div class="tl-month-row">'+mNames.map(function(m,i){
    var mi=(8+i)%12,my=mi>=8?tlSY:tlSY+1,cur=isCur&&mi===now.getMonth()&&my===now.getFullYear();
    return '<div class="tl-m'+(cur?' now':'')+'">'+m+'</div>';
  }).join('')+'</div>';
  var rows=active.map(function(p){
    var s=new Date(p.startDate),e=p.endDate?new Date(p.endDate):now;
    var cs=Math.max(s,start),ce=Math.min(e,end);
    var left=((cs-start)/total*100).toFixed(2),wid=Math.max(0.5,((ce-cs)/total*100)).toFixed(2);
    var col=tlColorFor(p.composer),todayLine=nowPct?'<div class="tl-now-line" style="left:'+nowPct+'%"></div>':'';
    var shortTitle=p.title.length>28?p.title.slice(0,26)+'\u2026':p.title;
    return '<div class="tl-row">'
      +'<div class="tl-lbl"><span class="tl-lbl-title">'+esc(shortTitle)+'</span><span class="tl-lbl-composer">'+esc(p.composer)+'</span></div>'
      +'<div class="tl-bar-area">'+todayLine
      +'<div class="tl-bar" style="left:'+left+'%;width:'+wid+'%;background:'+col+';" '
      +'onmouseenter="showTip(event,'+p._i+')" onmouseleave="hideTip()" onmousemove="moveTip(event)"></div>'
      +'</div></div>';
  }).join('');
  grid.innerHTML=mHeader+rows;
}

function showTip(e,idx){
  var p=pieces[idx]; if(!p) return;
  var notes=p.notes?'<br><span style="font-size:11px;color:var(--text2)">'+esc(p.notes.slice(0,80))+(p.notes.length>80?'\u2026':'')+'</span>':'';
  document.getElementById('tooltip').innerHTML='<strong>'+esc(p.title)+'</strong><em>'+esc(p.composer)+'</em><br>'+(fmt(p.startDate)||'?')+' \u2192 '+(p.endDate?fmt(p.endDate):'En cours')+notes;
  document.getElementById('tooltip').style.display='block'; moveTip(e);
}
function moveTip(e){var t=document.getElementById('tooltip');t.style.left=(e.clientX+14)+'px';t.style.top=(e.clientY-8)+'px';}
function hideTip(){document.getElementById('tooltip').style.display='none';}

ghLoad();
</script>
